allowBuilds:
  # Transitive dep of @earendil-works/pi-ai, pulled in for its Google provider.
  # Only the DeepSeek provider is registered (src/agent/model.ts), so this SDK is
  # never loaded and its install script has nothing to do here.
  '@google/genai': false
  # Installs the git hooks (see lefthook.yml).
  lefthook: true
  # Transitive dep of @larksuiteoapi/node-sdk. Its postinstall only sets up the
  # protobufjs CLI; the Lark WebSocket client works without it, so the script
  # stays denied rather than run for nothing.
  protobufjs: false
