name: Docker image

# Publishes to GitHub Container Registry. The image build runs `tsc`, so a
# commit that does not typecheck fails here and never reaches the registry.
on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  # One build per ref. Superseding an in-flight build of the same branch is
  # wanted; superseding a tag build is not, so releases are left alone.
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Pushing to GHCR with the automatic GITHUB_TOKEN.
      packages: write
      # actions/attest-build-provenance signs through the OIDC identity of this
      # workflow run.
      id-token: write
      attestations: write

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        # github.repository keeps the owner's casing (bestony/DeepTag) and
        # registry paths must be lowercase, so it is folded here rather than
        # hardcoded — a rename or a fork then still works.
        run: echo "name=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REPOSITORY: ${{ github.repository }}

      # Only the runtime stage is built per architecture (the build stage is
      # pinned to BUILDPLATFORM in the Dockerfile), so emulation covers one
      # `apt-get install tini` rather than a full pnpm install and tsc run.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        # A pull request from a fork gets a read-only token, and publishing
        # unreviewed code would be wrong even if it did not. Those builds still
        # run — they just stop before the push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=DeepTag
            org.opencontainers.image.description=Deepseek implement of Claude Tag

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 as well as amd64: the deployment target is as likely to be an
          # Ampere/Graviton VPS as an x86 one, and the cross-build is cheap
          # here for the reason given above.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # mode=max keeps the intermediate build stages, so a change to src/
          # reuses the cached pnpm install instead of resolving the tree again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Not the same thing as `provenance: mode=max` above, which records how
      # the image was built as an OCI attestation. This one is signed through
      # Sigstore and is what `gh attestation verify` checks against, i.e. proof
      # that the image on GHCR came out of this repository.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
